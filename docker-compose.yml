services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: unilib
      POSTGRES_USER: unilib
      POSTGRES_PASSWORD: unilib_dev_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - unilib_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unilib -d unilib"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ./src/server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://unilib:unilib_dev_only@db:5432/unilib?schema=public
      PORT: 3001
      CLIENT_ORIGIN: http://localhost:5173
      JWT_SECRET: unilib-development-only-secret-change-now
      RESERVATION_SWEEP_MS: 60000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:3001"
    command: ["sh", "-c", "npx prisma migrate deploy && node server.js"]
volumes:
  unilib_postgres: