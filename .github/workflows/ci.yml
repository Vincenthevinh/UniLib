name: UniLib CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README
        run: test -s README.md

      - name: Check merge conflicts
        shell: bash
        run: |
          set +e
          git grep -n -I -E '^(<{7}( |$)|={7}$|>{7}( |$))'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Unresolved merge conflicts found"
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "Unable to check merge conflicts (git grep exit $status)"
            exit "$status"
          fi

  server-ci:
    name: server-ci (src/server)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'src/server/package-lock.json'

      - name: Install server dependencies
        working-directory: src/server
        run: |
          npm ci
          npx prisma generate

      - name: Run server linter
        working-directory: src/server
        run: npm run lint

      - name: Run server test suite
        working-directory: src/server
        run: npm test

  client-ci:
    name: client-ci (src/client)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'src/client/package-lock.json'

      - name: Install client dependencies
        working-directory: src/client
        run: npm ci

      - name: Run client linter
        working-directory: src/client
        run: npm run lint

      - name: Run client test suite
        working-directory: src/client
        run: npm test

      - name: Build client production bundle
        working-directory: src/client
        run: npm run build
